<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmls="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de CRUD MVC</title>
</head>
<body>

    <header th:fragment="cabecero">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <span class="navbar-brand fw-semibold" th:text="#{plantilla.titulo}">APP WEB CON SPRING BOOT</span>
                <ul class="navbar-nav flex-row gap-3">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-people me-1"></i>Usuarios
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/bibliotecas}">
                            <i class="bi bi-building me-1"></i>Bibliotecas
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <footer th:fragment="pie" class="border-top mt-5 py-3 bg-white">
        <div class="container d-flex justify-content-between align-items-center">
            <small class="text-muted" th:text="#{plantilla.pie}">Sergio Luis Vargas Melendez</small>
            <a href="https://www.youtube.com/@SERGIOLUISVARGASMELENDEZESTUDI"
               class="text-muted text-decoration-none small">
                <i class="bi bi-youtube me-1"></i>Canal de Youtube
            </a>
        </div>
    </footer>

</body>
</html>
