<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejemplo de CRUD MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header th:replace="plantillas/partes::cabecero"></header>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-muted mb-0">Lista de usuarios</h5>
            <a th:href="@{/agregar}" class="btn btn-dark btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Agregar usuario
            </a>
        </div>

        <div th:if="${usuarios != null and !usuarios.isEmpty()}" class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Cédula</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Email</th>
                            <th scope="col">Password</th>
                            <th scope="col" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u: ${usuarios}">
                            <td th:text="${u.cedula}"></td>
                            <td th:text="${u.nombre}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.password}"></td>
                            <td class="text-center">
                                <a th:href="@{/editar/}+${u.cedula}" class="btn btn-outline-secondary btn-sm me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/eliminar/}+${u.cedula}" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${usuarios == null or usuarios.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-people fs-1 d-block mb-2"></i>
            <span th:text="#{usuario.lista-vacia}">La lista de usuarios está vacía.</span>
        </div>
    </main>

    <footer th:replace="plantillas/partes::pie"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
