<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bibliotecas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header th:replace="plantillas/partes::cabecero"></header>

    <main class="container py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="text-muted mb-0" th:text="#{biblioteca.lista}">Lista de Bibliotecas</h5>
            <a th:href="@{/bibliotecas/agregar}" class="btn btn-dark btn-sm">
                <i class="bi bi-plus-lg me-1"></i>Agregar biblioteca
            </a>
        </div>

        <div th:if="${bibliotecas != null and !bibliotecas.isEmpty()}" class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col" th:text="#{biblioteca.nombre}">Nombre</th>
                            <th scope="col" th:text="#{biblioteca.ciudad}">Ciudad</th>
                            <th scope="col" th:text="#{biblioteca.pais}">País</th>
                            <th scope="col" th:text="#{biblioteca.telefono}">Teléfono</th>
                            <th scope="col" th:text="#{biblioteca.email}">Email</th>
                            <th scope="col" th:text="#{biblioteca.esPublica}">¿Es Pública?</th>
                            <th scope="col" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${bibliotecas}">
                            <td th:text="${b.id}"></td>
                            <td th:text="${b.nombre}"></td>
                            <td th:text="${b.ciudad}"></td>
                            <td th:text="${b.pais}"></td>
                            <td th:text="${b.telefono}"></td>
                            <td th:text="${b.email}"></td>
                            <td>
                                <span th:if="${b.esPublica}" class="badge bg-success">Sí</span>
                                <span th:unless="${b.esPublica}" class="badge bg-secondary">No</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/bibliotecas/editar/} + ${b.id}" class="btn btn-outline-secondary btn-sm me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/bibliotecas/eliminar/} + ${b.id}" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${bibliotecas == null or bibliotecas.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-building fs-1 d-block mb-2"></i>
            <span th:text="#{biblioteca.lista-vacia}">La lista de bibliotecas está vacía.</span>
        </div>
    </main>

    <footer th:replace="plantillas/partes::pie"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
