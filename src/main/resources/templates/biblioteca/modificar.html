<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datos de la Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header th:replace="plantillas/partes::cabecero"></header>

    <main class="container py-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="text-muted mb-0" th:text="#{biblioteca.formulario}">Datos de la Biblioteca</h5>
                    <a th:href="@{/bibliotecas}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>[[#{accion.regresar}]]
                    </a>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="@{/bibliotecas/guardar}" method="POST" th:object="${biblioteca}">

                            <div class="row g-3 mb-2">
                                <div class="col-12">
                                    <label for="nombre" class="form-label small text-muted" th:text="#{biblioteca.nombre}"></label>
                                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}" required />
                                </div>

                                <div class="col-12">
                                    <label for="direccion" class="form-label small text-muted" th:text="#{biblioteca.direccion}"></label>
                                    <input type="text" id="direccion" class="form-control" th:field="*{direccion}" required />
                                </div>

                                <div class="col-md-6">
                                    <label for="ciudad" class="form-label small text-muted" th:text="#{biblioteca.ciudad}"></label>
                                    <input type="text" id="ciudad" class="form-control" th:field="*{ciudad}" required />
                                </div>

                                <div class="col-md-6">
                                    <label for="pais" class="form-label small text-muted" th:text="#{biblioteca.pais}"></label>
                                    <input type="text" id="pais" class="form-control" th:field="*{pais}" required />
                                </div>

                                <div class="col-md-6">
                                    <label for="telefono" class="form-label small text-muted" th:text="#{biblioteca.telefono}"></label>
                                    <input type="tel" id="telefono" class="form-control" th:field="*{telefono}" />
                                </div>

                                <div class="col-md-6">
                                    <label for="email" class="form-label small text-muted" th:text="#{biblioteca.email}"></label>
                                    <input type="email" id="email" class="form-control" th:field="*{email}" />
                                </div>

                                <div class="col-md-6">
                                    <label for="horarioApertura" class="form-label small text-muted" th:text="#{biblioteca.horarioApertura}"></label>
                                    <input type="time" id="horarioApertura" class="form-control" th:field="*{horarioApertura}" />
                                </div>

                                <div class="col-md-6">
                                    <label for="horarioCierre" class="form-label small text-muted" th:text="#{biblioteca.horarioCierre}"></label>
                                    <input type="time" id="horarioCierre" class="form-control" th:field="*{horarioCierre}" />
                                </div>

                                <div class="col-md-6">
                                    <label for="numLibros" class="form-label small text-muted" th:text="#{biblioteca.numLibros}"></label>
                                    <input type="number" id="numLibros" class="form-control" th:field="*{numLibros}" min="0" />
                                </div>

                                <div class="col-md-6">
                                    <label for="numUsuarios" class="form-label small text-muted" th:text="#{biblioteca.numUsuarios}"></label>
                                    <input type="number" id="numUsuarios" class="form-control" th:field="*{numUsuarios}" min="0" />
                                </div>

                                <div class="col-md-6">
                                    <label for="web" class="form-label small text-muted" th:text="#{biblioteca.web}"></label>
                                    <input type="url" id="web" class="form-control" th:field="*{web}" />
                                </div>

                                <div class="col-md-6 d-flex align-items-end">
                                    <div class="form-check mb-2">
                                        <input type="checkbox" id="esPublica" class="form-check-input" th:field="*{esPublica}" />
                                        <label for="esPublica" class="form-check-label small text-muted" th:text="#{biblioteca.esPublica}"></label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-3">
                                <input type="reset" class="btn btn-outline-secondary btn-sm" th:value="#{accion.reiniciar}" />
                                <input type="submit" name="guardar" class="btn btn-dark btn-sm" th:value="#{accion.guardar}" />
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer th:replace="plantillas/partes::pie"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
