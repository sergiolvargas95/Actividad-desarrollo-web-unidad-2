<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmls="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datos del Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header th:replace="plantillas/partes::cabecero"></header>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="text-muted mb-0" th:text="#{usuario.formulario}">Datos del Usuario</h5>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>[[#{accion.regresar}]]
                    </a>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="@{/guardar}" method="POST" th:object="${usuario}">

                            <div class="mb-3">
                                <label for="cedula" class="form-label small text-muted" th:text="#{usuario.cedula}"></label>
                                <input type="text" id="cedula" class="form-control" name="cedula" th:field="*{cedula}" required />
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label small text-muted" th:text="#{usuario.password}"></label>
                                <input type="password" id="password" class="form-control" name="password" th:field="*{password}" />
                            </div>

                            <div class="mb-3">
                                <label for="nombre" class="form-label small text-muted" th:text="#{usuario.nombre}"></label>
                                <input type="text" id="nombre" class="form-control" name="nombre" th:field="*{nombre}" required />
                            </div>

                            <div class="mb-4">
                                <label for="email" class="form-label small text-muted" th:text="#{usuario.email}"></label>
                                <input type="email" id="email" class="form-control" name="email" th:field="*{email}" />
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <input type="reset" class="btn btn-outline-secondary btn-sm" th:value="#{accion.reiniciar}" />
                                <input type="submit" name="guardar" class="btn btn-dark btn-sm" th:value="#{accion.agregar}" />
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer th:replace="plantillas/partes::pie"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
